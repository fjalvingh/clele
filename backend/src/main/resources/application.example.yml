spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/partsdb
    username: partsuser
    password: partspass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

anthropic:
  # No app-wide key: each organisation stores its own (encrypted) and pays its own bill -- an
  # Organisation Admin enters it under Admin Actions -> AI lookup. This is only the default model
  # for an organisation that has not chosen one.
  model: claude-haiku-4-5-20251001
  # Rates used only to put a cost estimate in the per-search log line — they bill nothing. The
  # defaults are Claude Haiku 4.5's ($1 / $5 per million tokens) and match the `model` above; a
  # cached read costs 0.1x input and a cache write 1.25x, which is why the multipliers are here
  # rather than inlined. CHANGE THESE WITH THE MODEL — a stale rate makes the logged cost
  # confidently wrong, which is worse than logging no cost at all. The logged line always names
  # the model it priced, so a mismatch is at least visible.
  pricing:
    input-per-mtok: 1.00
    output-per-mtok: 5.00
    cache-read-multiplier: 0.1
    cache-write-multiplier: 1.25
    # Server-side web search, billed per thousand searches.
    web-search-per-ksearch: 10.00

# Local AI (Ollama) used for offline part auto-categorization
ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b-instruct

# OctoPart (Nexar) part enrichment. Credentials are per-user (set on the profile page); this is
# only the per-user monthly request cap matching the free Nexar contract.
octopart:
  monthly-limit: 100

app:
  # Encrypts the secrets this app holds for a tenant -- today an organisation's Anthropic API key.
  # Any long random string, supplied from the environment so it stays out of the jar. Unset, no
  # organisation can store an API key and AI lookups stay off (the admin screen says so).
  # CHANGING IT makes stored keys undecryptable: they have to be entered again.
  secret-key: "${APP_SECRET_KEY:}"
